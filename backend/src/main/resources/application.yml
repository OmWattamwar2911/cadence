server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: wallet-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:wallet_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:wallet_user}
    password: ${DB_PASSWORD:wallet_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  fraud:
    max-amount-per-transfer: ${FRAUD_MAX_AMOUNT_PER_TRANSFER:10000000} # 10,000,000 paise (₹100,000)
    velocity-max-transfers: ${FRAUD_VELOCITY_MAX_TRANSFERS:5}
    velocity-window-minutes: ${FRAUD_VELOCITY_WINDOW_MINUTES:5}
  rate-limit:
    login:
      capacity: ${RATE_LIMIT_LOGIN_CAPACITY:5}
      refill-tokens: ${RATE_LIMIT_LOGIN_REFILL_TOKENS:5}
      refill-duration-seconds: ${RATE_LIMIT_LOGIN_REFILL_DURATION_SECONDS:60}
    transfer:
      capacity: ${RATE_LIMIT_TRANSFER_CAPACITY:10}
      refill-tokens: ${RATE_LIMIT_TRANSFER_REFILL_TOKENS:10}
      refill-duration-seconds: ${RATE_LIMIT_TRANSFER_REFILL_DURATION_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n"
  level:
    com.walletservice: INFO
    org.springframework.security: WARN
