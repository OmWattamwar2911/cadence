<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="auto">
  <defs>
    <!-- 40px Faint Sage Hero Grid -->
    <pattern id="heroGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#b7c6c2" stroke-width="1" stroke-opacity="0.30" />
    </pattern>

    <!-- Warm Pale-Yellow Ambient Glow at the bottom -->
    <radialGradient id="heroGlow" cx="50%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#ffe17c" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#ffe17c" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Abstract Mockup Browser Frame -->
    <filter id="mockupShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#171e19" flood-opacity="0.12" />
    </filter>

    <!-- Card Shadow inside Mockup -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <style>
    .headline { font-family: 'Anton', 'Impact', 'Arial Black', sans-serif; font-weight: 900; text-transform: uppercase; }
    .body { font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- 1. Base Canvas Background -->
  <rect width="1200" height="700" fill="#ffffff" />

  <!-- 2. Hero Grid Pattern Overlay -->
  <rect width="1200" height="700" fill="url(#heroGrid)" />

  <!-- 3. Pale Yellow Bottom Glow -->
  <rect width="1200" height="700" fill="url(#heroGlow)" />

  <!-- Outer Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="699" fill="none" stroke="#171e19" stroke-opacity="0.08" />

  <!-- ========================================================================= -->
  <!-- NAVBAR (Just like Application Header) -->
  <!-- ========================================================================= -->
  <g transform="translate(0, 0)">
    <!-- Navbar glass background & bottom border -->
    <rect width="1200" height="68" fill="#ffffff" fill-opacity="0.90" />
    <line x1="0" y1="68" x2="1200" y2="68" stroke="#171e19" stroke-opacity="0.08" />

    <!-- Left Brand Logo -->
    <g transform="translate(50, 44)">
      <text class="headline" font-size="28" fill="#171e19" letter-spacing="0.5">
        CADENCE<tspan fill="#ffe17c">.</tspan>
      </text>
    </g>

    <!-- Center Navigation Links -->
    <g transform="translate(470, 42)" class="body" font-size="14" font-weight="500" fill="#171e19">
      <text x="0" y="0">Features</text>
      <text x="90" y="0">How it Works</text>
      <text x="210" y="0">Security</text>
    </g>

    <!-- Right Actions -->
    <g transform="translate(980, 22)">
      <!-- Login Link -->
      <text x="0" y="24" class="body" font-size="13" font-weight="700" fill="#171e19" letter-spacing="1">LOGIN</text>

      <!-- Get Started Dark Pill Button -->
      <rect x="68" y="0" width="115" height="36" rx="18" fill="#171e19" />
      <text x="125.5" y="22" class="body" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1" text-anchor="middle">GET STARTED</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- HERO CONTENT -->
  <!-- ========================================================================= -->
  
  <!-- Pill Badge: BUILT FOR SAFE TRANSFERS -->
  <g transform="translate(600, 115)">
    <g transform="translate(-130, 0)">
      <rect width="260" height="30" rx="15" fill="#f1f5f9" stroke="#171e19" stroke-opacity="0.10" />
      <circle cx="20" cy="15" r="4" fill="#ffe17c" stroke="#171e19" stroke-width="0.5" stroke-opacity="0.3" />
      <text x="34" y="19.5" class="body" font-size="11" font-weight="700" fill="#171e19" letter-spacing="1.6">BUILT FOR SAFE TRANSFERS</text>
    </g>
  </g>

  <!-- Big Hero Headline: MOVE MONEY WITHOUT CHAOS -->
  <g transform="translate(600, 205)" text-anchor="middle">
    <!-- Line 1: MOVE MONEY WITHOUT -->
    <text class="headline" font-size="64" fill="#171e19" letter-spacing="0.5">
      MOVE MONEY WITHOUT
    </text>

    <!-- Line 2: CHAOS with Yellow Highlight Bar -->
    <g transform="translate(0, 68)">
      <!-- Yellow Bar behind CHAOS: tilted -2.5 degrees -->
      <rect x="-105" y="-38" width="210" height="46" rx="4" fill="#ffe17c" transform="rotate(-2)" />
      <!-- Text CHAOS on top -->
      <text class="headline" font-size="64" fill="#171e19" letter-spacing="1.5">
        CHAOS
      </text>
    </g>
  </g>

  <!-- Subheadline -->
  <g transform="translate(600, 320)" text-anchor="middle">
    <text class="body" font-size="16" font-weight="400" fill="#171e19" fill-opacity="0.72">
      Send, receive and track money with a ledger-backed wallet.
    </text>
    <text x="0" y="24" class="body" font-size="16" font-weight="400" fill="#171e19" fill-opacity="0.72">
      Every transfer is atomic, idempotent and fully traceable.
    </text>
  </g>

  <!-- Inline Email Form + Yellow GET STARTED Button -->
  <g transform="translate(600, 385)">
    <!-- Form container centered -->
    <g transform="translate(-230, 0)">
      <!-- Email Input Field -->
      <rect x="0" y="0" width="310" height="46" rx="8" fill="#ffffff" stroke="#171e19" stroke-opacity="0.25" />
      <text x="20" y="28" class="body" font-size="14" fill="#94a3b8">you@email.com</text>

      <!-- Yellow Primary Button (Anton uppercase) -->
      <g transform="translate(322, 0)">
        <rect width="138" height="46" rx="8" fill="#ffe17c" stroke="#171e19" stroke-opacity="0.15" />
        <text x="69" y="30" class="headline" font-size="17" fill="#171e19" letter-spacing="0.8" text-anchor="middle">GET STARTED</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- ABSTRACT UI MOCKUP PEEKING FROM THE BOTTOM -->
  <!-- ========================================================================= -->
  <g transform="translate(200, 465)" filter="url(#mockupShadow)">
    <!-- Browser Window Card Container -->
    <rect width="800" height="300" rx="16" fill="#ffffff" stroke="#171e19" stroke-opacity="0.12" />

    <!-- Browser Window Header Bar -->
    <path d="M 0 16 Q 0 0 16 0 L 784 0 Q 800 0 800 16 L 800 40 L 0 40 Z" fill="#f8fafc" stroke="#171e19" stroke-opacity="0.08" />
    <line x1="0" y1="40" x2="800" y2="40" stroke="#171e19" stroke-opacity="0.08" />

    <!-- Traffic Light Window Buttons -->
    <circle cx="24" cy="20" r="5" fill="#ff5f56" />
    <circle cx="40" cy="20" r="5" fill="#ffbd2e" />
    <circle cx="56" cy="20" r="5" fill="#27c93f" />

    <!-- Window Title -->
    <text x="400" y="25" class="body" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">
      Cadence - Dashboard
    </text>

    <!-- Browser Body Content -->
    <g transform="translate(0, 40)">
      <!-- Body Background Canvas -->
      <rect width="800" height="260" fill="#f1f5f9" />

      <!-- 1. Left Sidebar -->
      <rect width="180" height="260" fill="#ffffff" />
      <line x1="180" y1="0" x2="180" y2="260" stroke="#171e19" stroke-opacity="0.08" />

      <g transform="translate(18, 22)">
        <text class="body" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">MENU</text>

        <!-- Active Wallet Pill -->
        <g transform="translate(0, 14)">
          <rect width="144" height="34" rx="6" fill="#ffe17c" />
          <!-- Wallet icon (rect + dot) -->
          <rect x="14" y="10" width="14" height="12" rx="2" fill="none" stroke="#171e19" stroke-width="1.8" />
          <circle cx="23" cy="16" r="1.2" fill="#171e19" />
          <text x="36" y="22" class="body" font-size="12" font-weight="700" fill="#171e19">Wallet</text>
        </g>

        <!-- Inactive Send -->
        <g transform="translate(0, 56)">
          <!-- Send paper airplane icon -->
          <path d="M 14 12 L 26 17 L 14 22 L 17 17 Z" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linejoin="round" />
          <text x="36" y="21" class="body" font-size="12" font-weight="500" fill="#64748b">Send</text>
        </g>

        <!-- Inactive History -->
        <g transform="translate(0, 94)">
          <!-- Clock icon -->
          <circle cx="20" cy="17" r="6" fill="none" stroke="#64748b" stroke-width="1.6" />
          <polyline points="20 14 20 17 23 17" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" />
          <text x="36" y="21" class="body" font-size="12" font-weight="500" fill="#64748b">History</text>
        </g>
      </g>

      <!-- 2. Main Canvas -->
      <g transform="translate(200, 18)">
        <!-- Sample Balance Card -->
        <g filter="url(#cardShadow)">
          <rect width="360" height="96" rx="10" fill="#ffffff" stroke="#171e19" stroke-opacity="0.08" />

          <g transform="translate(20, 24)">
            <text class="body" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5">SAMPLE BALANCE</text>

            <!-- Sample Data Badge -->
            <rect x="238" y="-12" width="76" height="18" rx="4" fill="#ffe17c" />
            <text x="276" y="1" class="body" font-size="8.5" font-weight="700" fill="#171e19" text-anchor="middle">SAMPLE DATA</text>

            <text x="0" y="34" class="headline" font-size="30" fill="#171e19" letter-spacing="0.5">
              ₹12,450.00
            </text>

            <text x="0" y="52" class="body" font-size="10.5" fill="#94a3b8">
              Wallet ID #10492 • INR • Verified
            </text>
          </g>
        </g>

        <!-- Recent Transactions Card -->
        <g transform="translate(0, 110)" filter="url(#cardShadow)">
          <rect width="360" height="116" rx="10" fill="#ffffff" stroke="#171e19" stroke-opacity="0.08" />

          <g transform="translate(20, 20)">
            <text class="body" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5">RECENT TRANSFERS</text>

            <!-- Tx 1: Debit -->
            <g transform="translate(0, 18)">
              <text class="body" font-size="11" font-weight="700" fill="#171e19">P2P Transfer to rahul@upi</text>
              <text x="0" y="14" class="body" font-size="9.5" fill="#94a3b8">DEP-9418 • Idempotent</text>
              <text x="320" y="10" class="body" font-size="12" font-weight="700" fill="#ef4444" text-anchor="end">-₹1,500.00</text>
              <line x1="0" y1="22" x2="320" y2="22" stroke="#f1f5f9" stroke-width="1" />
            </g>

            <!-- Tx 2: Deposit -->
            <g transform="translate(0, 52)">
              <text class="body" font-size="11" font-weight="700" fill="#171e19">Instant Wallet Deposit</text>
              <text x="0" y="14" class="body" font-size="9.5" fill="#94a3b8">DEP-1204 • Verified</text>
              <text x="320" y="10" class="body" font-size="12" font-weight="700" fill="#10b981" text-anchor="end">+₹5,000.00</text>
            </g>
          </g>
        </g>
      </g>

      <!-- 3. Right Properties Panel -->
      <g transform="translate(580, 0)">
        <rect width="220" height="260" fill="#ffffff" />
        <line x1="0" y1="0" x2="0" y2="260" stroke="#171e19" stroke-opacity="0.08" />

        <g transform="translate(20, 22)">
          <text class="body" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">SYSTEM GUARDS</text>

          <!-- Guard Item 1 -->
          <g transform="translate(0, 20)">
            <rect width="180" height="34" rx="6" fill="#f8fafc" stroke="#171e19" stroke-opacity="0.06" />
            <circle cx="16" cy="17" r="3" fill="#10b981" />
            <text x="28" y="21" class="body" font-size="11" font-weight="600" fill="#171e19">Ordered Row Locks</text>
          </g>

          <!-- Guard Item 2 -->
          <g transform="translate(0, 62)">
            <rect width="180" height="34" rx="6" fill="#f8fafc" stroke="#171e19" stroke-opacity="0.06" />
            <circle cx="16" cy="17" r="3" fill="#10b981" />
            <text x="28" y="21" class="body" font-size="11" font-weight="600" fill="#171e19">Double-Entry Ledger</text>
          </g>

          <!-- Guard Item 3 -->
          <g transform="translate(0, 104)">
            <rect width="180" height="34" rx="6" fill="#f8fafc" stroke="#171e19" stroke-opacity="0.06" />
            <circle cx="16" cy="17" r="3" fill="#10b981" />
            <text x="28" y="21" class="body" font-size="11" font-weight="600" fill="#171e19">Zero Float Drift</text>
          </g>

          <!-- Accent Swatch -->
          <g transform="translate(0, 150)">
            <rect width="24" height="24" rx="4" fill="#ffe17c" stroke="#171e19" stroke-opacity="0.15" />
            <text x="32" y="16" class="mono" font-size="10" font-weight="600" fill="#64748b">#FFE17C</text>
          </g>
        </g>
      </g>

      <!-- Floating Mouse Cursor + alex@cadence Name Tag -->
      <g transform="translate(530, 150)">
        <!-- Mouse Arrow Pointer (Black with white border) -->
        <path d="M 0 0 L 14 14 L 8 15 L 12 24 L 8 26 L 4 17 L 0 20 Z" fill="#171e19" stroke="#ffffff" stroke-width="1.5" />
        
        <!-- alex@cadence name tag pill -->
        <g transform="translate(18, 16)">
          <rect width="105" height="22" rx="4" fill="#171e19" />
          <text x="52.5" y="15" class="mono" font-size="10" font-weight="600" fill="#ffe17c" text-anchor="middle">alex@cadence</text>
        </g>
      </g>
    </g>
  </g>
</svg>
